
<html>

		<link rel='stylesheet' href="../style.css">

		<style>
			figure {
				/*display: table; ne marche pas avec safari */
				width: 250;
				height: 400;
				text-align: center;
				padding: 10px;
				background-color: rgb(255, 237, 194);
				border-radius: 12px;
			}

			figure img {
				display:table-row;
				margin: 0 auto;
				max-width: 100%;
				max-height: 100%;
				
			}

			figure figcaption {
				display:table-row;
				vertical-align: middle;
				margin: auto 10px;
			}
		</style>

		<div
			class="list"
			id = "album_image_list"
		>



			<script>

				const album_image_list = document.getElementById('album_image_list')

				function nv_image(src, txt){

					const cadre = document.createElement('div')
					album_image_list.appendChild(cadre)
					cadre.classList.add('ma_deco')
					cadre.style.padding = 10
					cadre.style.margin = 10
					cadre.style.width = 280
					cadre.style.height = 370

					cadre.style.display = 'flex'
					cadre.style.flexDirection = 'column'
					cadre.style.flexWrap = 'nowrap'
					cadre.style.justifyContent = 'space-evenly'
					cadre.style.alignItems = 'stretch'
					cadre.style.alignContent = 'stretch'
					cadre.style.gap = '10'

					const img = document.createElement('img')
					img.src = src
					img.style.flex = 1
					img.style.height = '90%'
					img.style.borderRadius = '10px'
					img.style.overflow = 'hidden'
					//img.margin ='0 auto'
					//img.style.width = '100%'
					//img.style.height = '90%'
					img.style.objectFit = 'cover'
					/*img.addEventListener('click', ev => {
						const fsim = document.createElement('img')
						//album_image_list.appendChild(fsim)
						cadre.style.position = 'relative'
						cadre.appendChild(fsim)
						fsim.style.position = 'absolute'
						fsim.style.top = 0
						fsim.style.bottom = 0
						fsim.style.left = 0
						fsim.style.right = 0
						fsim.style.zIndex = -10000
					})*/


					
					
					cadre.appendChild(img)

					const etxt = document.createElement('div')
					etxt.style.textAlign = 'center'
					etxt.innerText = txt
					etxt.flex = 'none'
					etxt.style.margin = '7px 0px 0px 0px'
					cadre.appendChild(etxt)
				}


				nv_image(
					'espace devi.jpg',
					'Programmme MBSR avec Valérie, mars-mai 23',
				)


				nv_image(

				nv_image(
