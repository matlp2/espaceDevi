			<br>
			<br>
			<br>Pratiquer le chant védique, c’est réciter ou psalmodier des textes sacrés, rédigés en sanscrit. Ces textes proviennent de la plus ancienne tradition de l’Inde. La première étape de l’apprentissage consiste à écouter, puis à répéter. L’oreille est entraînée par des exercices d’écoute, ceci aiguise l’attention et la concentration. Dans un deuxième temps la signification du texte est abordée.
			<br>
			<br>Hélène est diplômée de l’Institut Français de Yoga depuis 2002. Parallèlement au yoga, elle a étudié le chant védique: initiation avec <i>Mekhala Desikachar</i> en 2001 à Chennai, puis de 2002 à 2007, elle a continué avec <i>Simone Templehof-Moors</i> (fondatrice en Belgique de l’école <i>Svadhyahya : Étude de soi et récitation des chants sacrés</i>).
			<br>Hélène a continué à approfondir ses connaissances en chant védique chaque année, en participant aux séminaires de <i>Radha Sundararajan</i> de Chennai. Elle travaille aujourd’hui avec <i>Elisabeth Libraire</i> " qui a une approche très sensible des textes védiques et une connaissance affinée du sanscrit.
			<br>
			<br>
			<br>

	<script>

	const expands = document.getElementsByClassName('mon_container')
	const contents = document.getElementsByClassName('mon_content')

	for(var i = 0; i < expands.length; ++i) {

		expands[i].addEventListener("click", ()=>{
			if (contents[j].style.display == 'block') {
