			<br>Pratiquer le chant védique, c’est réciter ou psalmodier des textes sacrés, rédigés en sanscrit. Ces textes proviennent de la plus ancienne tradition de l’Inde. La première étape de l’apprentissage consiste à écouter, puis à répéter. L’oreille est entraînée par des exercices d’écoute, ceci aiguise l’attention et la concentration. Dans un deuxième temps la signification du texte est abordée.

	const contents = document.getElementsByClassName('mon_content')

	for(var i = 0; i < expands.length; ++i) {

			if (contents[j].style.display == 'block') {

			}else{
				contents[j].style.display = 'block'
