			function remap(t, A, B, A2, B2) {
				return A2 + ((t - A) / (B - A))*(B2 - A2)
			}

			function map_retire_intervalle(t, intervalle, intervalle_enlevé) {
				const [A, B] = intervalle
				const [A2, B2] = intervalle_enlevé
				M = .5*(A2 + B2)
				return t < M ? remap(t, A, A2, A, M) : remap(t, B2, B, M, B)
			}

			function map_time_simple([hour, minutes]) {
				const d = map_time_simple.max-map_time_simple.min

			function map_time_remove_interval(hour_minutes) {

			// programmation dynamique
			function minTotalDistanceWithAssignment(items, slots) {
				const M = items.length
				const N = slots.length

				// sort for monotonicity
				items = [...items].sort((a, b) => a.target_y - b.target_y)
				slots = [...slots].sort((a, b) => a - b)

				// dp[j][i] = min cost for first j items in first i slots
				const dp = Array.from({ length: M + 1 }, () => Array(N + 1).fill(Infinity))
				const choice = Array.from({ length: M + 1 }, () => Array(N + 1).fill(null))

				// base case
				for (let i = 0; i <= N; i++) dp[0][i] = 0;

				for (let j = 1; j <= M; j++) {
					for (let i = 1; i <= N; i++) {
						// option 1: skip this slot
						if (dp[j][i-1] < dp[j][i]) {
							dp[j][i] = dp[j][i-1];
							choice[j][i] = "skip";
						}

						// option 2: assign item j to slot i
						const cost = dp[j-1][i-1] + Math.abs(items[j-1].target_y - slots[i-1]);
						if (cost < dp[j][i]) {
							dp[j][i] = cost;
							choice[j][i] = "assign";
						}
					}
				}

				// backtrack
				const assignment = new Array(M).fill(-1);
				let j = M, i = N;
				while (j > 0 && i > 0) {
					if (choice[j][i] === "assign") {
						assignment[j-1] = i-1; // item j-1 goes to slot i-1
						j--;
						i--;
					} else {
						i--;
					}
				}

				return {
					sorted_items: items,
					cost: dp[M][N],
					assignment, // item -> slot index
				}
			}
