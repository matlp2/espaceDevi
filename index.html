<html>

	<head>
		<title>EspaceDevi - Yoga Rennes</title>
		<meta charset="UTF-16">

		<meta name="description" content="Espace Devi, situé au coeur de la ville de Rennes est un lieu de pratique de Yoga.">


		<!-- pour pas que le font size soit petit sur telephone -->
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<style>
		</style>


		<link rel="icon" type="image/x-icon" href="espaceDevi_orange_carre.png">
		<link rel='stylesheet' href="style.css">
	</head>

	<body
		style='
		margin:0;
		
		max-width:100%;overflow-x:hidden;/* disable horizontal scroll */
		overflow-y:hidden;/* disable vertical scroll (le scroll est dans l iframe) */
		background-color: rgba(255, 218, 130, 1);
		
		height: 100%;
		'
	>
		<div
			class="vertical_flex_list"
			style="
				list-style-type: none;
				height: 100%;
				margin: 0;
				padding: 0;
				gap:0px;
			"
		>
			
			<style>
				.tabs_menu {
					width: 100%;
					background-color: rgba(255, 255, 255, .5);
					padding-top: 0;
					padding-bottom: 0;
					font-family: sans-serif;
					box-shadow: 0 -1px 10px 0px orange;
					position: relative;/* position: relative pour que l'ombre soit au dessus les elms suivant de la liste */
				}
				.tabs_menu td {
					cursor: pointer;
					text-align: center;
					padding-top: 10;
					padding-bottom: 10;
					/*font-size: calc(min(30px,100%));*/
				}
			</style>

			
			

			<table
				class='flex_elm_self_sized tabs_menu'
				id='tab_menu'
			>
				<tbody>
					<tr>
						<td
							id = 'tab_acceuil'
							onclick="tab_content.src = 'acceuil/acceuil.html'; on_select_tab(this)"
						>
							Accueil
						</td>

						<td
							onclick="tab_content.src = 'planning/planning.html'; on_select_tab(this)"
						>
							Planning
						</td>

						<td
							onclick="tab_content.src = 'actualite/actualite.html'; on_select_tab(this)"
						>
							Actualités
						</td>

						<td
							onclick="tab_content.src = 'album/album.html'; on_select_tab(this)"
						>
							Album
						</td>

						<td
							onclick="tab_content.src = 'contact/contact.html'; on_select_tab(this)"
						>
							Contact
						</td>
					</tr>
				</tbody>
			</table>





			<script>

				function remove_children_nodes(elm) {
					while (elm.firstChild) {
						elm.removeChild(elm.lastChild);
					}
				}

				var _selection = null

				function on_select_tab(elm) {
					
					if(_selection !== null) {
						for(const sub of _selection.children) {
							if(sub.classList.contains('tab_selection_indicator')) {
								_selection.removeChild(sub)
								break
							}
						}
					}

					_selection = elm

					_selection.style.position = 'relative'

					

					const tmp = document.createElement("div");
					tmp.innerHTML = `
					<div
						class = "tab_selection_indicator"
						style = "
							position: absolute;
							display: flex;
							justify-content: center;
							align-items: center;
							width: 100%;
							height: .25em;
							bottom: 0%;
						"
					>
						<div
							style = "
								background-color: rgb(250, 200, 100);
								border-radius: .15em;
								width: 5em;
								height: .1em;
							"
						>
						</div>
					</div>
					`
					const indicator = tmp.children[0]

					_selection.append(indicator)
				}

				on_select_tab(document.getElementById('tab_acceuil'))

			</script>






			<iframe
				id='tab_content'
				class="flex_elm_streched"
				src = 'acceuil/acceuil.html'
				marginwidth="0"
				marginheight="0"
				frameborder="0"
				style = '
					margin: 0;
					padding: 0;
				'
			
			>
				Browser not compatible
			</iframe>
			
			<script>

				const tab_content = document.getElementById('tab_content')
				const tab_menu = document.getElementById('tab_menu')


				const maj_tabs_menu_font_size = () => {
					tab_menu.style['font-size'] = Math.min(25, .04*tab_content.clientWidth)
					//tab_content.style.fontSize = 1
					const iframe_body = tab_content.contentWindow.document.querySelector('body')
					iframe_body.style.fontSize = 25
				}
				maj_tabs_menu_font_size()
				window.addEventListener('resize',()=>{
					maj_tabs_menu_font_size()
				})

			</script>

		</div>

	</body>

</html>
